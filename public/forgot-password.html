<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Forgot Password — BrainCastle</title><link rel="stylesheet" href="/css/base.css"><link rel="stylesheet" href="/css/components.css"></head>
<body><header class="navbar"><div class="container nav-container"><a href="/" class="nav-brand"><div class="brand-icon">🏰</div><span>Brain<span style="color:var(--color-primary)">Castle</span></span></a><a href="/login.html" class="btn btn-outline btn-sm">Back to sign in</a></div></header>
<main class="container"><section class="auth-card" style="max-width:440px;margin:var(--space-8) auto;padding:var(--space-6);background:var(--color-bg-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);box-shadow:var(--shadow-md)"><h1 style="margin-bottom:var(--space-2)">Reset your password</h1><p style="color:var(--color-text-secondary);margin-bottom:var(--space-5)">Enter your account email. If it matches an account, we'll send a secure reset link.</p><form id="forgotForm"><label class="form-label" for="email">Email address</label><input class="search-input" style="width:100%;margin-bottom:var(--space-4)" id="email" type="email" required autocomplete="email" placeholder="you@example.com"><button class="btn btn-primary btn-block" id="sendBtn">Send reset link</button></form><p id="message" role="status" style="margin-top:var(--space-4);font-size:var(--font-size-sm)"></p></section></main><script src="/js/api.js"></script><script src="/js/forgot-password.js"></script></body></html>
