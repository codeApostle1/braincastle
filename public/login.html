<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrainCastle — Creator Authentication</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <style>
    .auth-card {
      max-width: 440px;
      margin: var(--space-8) auto;
      padding: var(--space-6);
      background: var(--color-bg-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      animation: fadeIn 0.25s ease;
    }
    .auth-tabs {
      display: flex;
      margin-bottom: var(--space-6);
      border-bottom: 1px solid var(--color-border);
    }
    .auth-tab {
      flex: 1;
      text-align: center;
      padding: var(--space-3);
      cursor: pointer;
      font-weight: 700;
      color: var(--color-text-secondary);
      border-bottom: 2px solid transparent;
      transition: all var(--transition-fast);
      user-select: none;
    }
    .auth-tab.active {
      color: var(--color-primary);
      border-bottom-color: var(--color-primary);
    }
    .auth-alert {
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-md);
      font-size: var(--font-size-sm);
      margin-bottom: var(--space-4);
      display: none;
    }
    .password-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }
    .password-input-wrap input {
      padding-right: 2.75rem !important;
      width: 100%;
    }
    .toggle-password-btn {
      position: absolute;
      right: 0.6rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      padding: 0.35rem;
      cursor: pointer;
      color: var(--color-text-muted);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
      line-height: 1;
    }
    .toggle-password-btn:hover {
      color: var(--color-primary);
      background-color: var(--color-bg-hover);
    }
  </style>
</head>
<body>

  <!-- Topbar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="/" class="nav-brand">
        <div class="brand-icon">🏰</div>
        <span>Brain<span style="color: var(--color-primary)">Castle</span></span>
      </a>
      <a href="/" class="btn btn-outline btn-sm">&larr; Public Platform</a>
    </div>
  </header>

  <main class="container">
    <div class="auth-card">
      <div class="auth-tabs">
        <div class="auth-tab active" id="tabLogin">Sign In</div>
        <div class="auth-tab" id="tabRegister">Register Creator</div>
      </div>

      <div id="authAlert" class="auth-alert"></div>

      <!-- Sign In Form -->
      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail" class="form-label">Email Address</label>
          <input 
            type="email" 
            id="loginEmail" 
            class="search-input" 
            style="padding-left: 1rem;" 
            value="creator@example.com" 
            placeholder="you@example.com" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="loginPassword" class="form-label">Password</label>
          <div class="password-input-wrap">
            <input 
              type="password" 
              id="loginPassword" 
              class="search-input" 
              style="padding-left: 1rem;" 
              value="password123" 
              placeholder="••••••••" 
              required 
            />
            <button type="button" class="toggle-password-btn" data-target="loginPassword" aria-label="Toggle password visibility" title="Show/Hide password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <!-- Default demo credentials removed -->
        </div>

        <div class="form-group" style="display: flex; align-items: center; justify-content: space-between;">
          <label style="display: flex; align-items: center; gap: var(--space-2); font-size: var(--font-size-xs); cursor: pointer; color: var(--color-text-secondary);">
            <input type="checkbox" id="rememberMe" checked />
            <span>Remember me on this browser</span>
          </label>
        </div>

        <button type="submit" id="loginSubmitBtn" class="btn btn-primary btn-block" style="margin-top: var(--space-4);">
          Sign In to Dashboard &rarr;
        </button>
      </form>

      <!-- Registration Form -->
      <form id="registerForm" style="display: none;">
        <div class="form-group">
          <label for="regName" class="form-label">Creator / Display Name</label>
          <input 
            type="text" 
            id="regName" 
            class="search-input" 
            style="padding-left: 1rem;" 
            placeholder="e.g. codeapostle1" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="regEmail" class="form-label">Email Address</label>
          <input 
            type="email" 
            id="regEmail" 
            class="search-input" 
            style="padding-left: 1rem;" 
            placeholder="newcreator@example.com" 
            required 
          />
        </div>

        <div class="form-group">
          <label for="regPassword" class="form-label">Password</label>
          <div class="password-input-wrap">
            <input 
              type="password" 
              id="regPassword" 
              class="search-input" 
              style="padding-left: 1rem;" 
              placeholder="At least 6 characters" 
              required 
            />
            <button type="button" class="toggle-password-btn" data-target="regPassword" aria-label="Toggle password visibility" title="Show/Hide password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="regConfirmPassword" class="form-label">Confirm Password</label>
          <div class="password-input-wrap">
            <input 
              type="password" 
              id="regConfirmPassword" 
              class="search-input" 
              style="padding-left: 1rem;" 
              placeholder="Repeat password" 
              required 
            />
            <button type="button" class="toggle-password-btn" data-target="regConfirmPassword" aria-label="Toggle password visibility" title="Show/Hide password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="regSubmitBtn" class="btn btn-primary btn-block" style="margin-top: var(--space-4);">
          Create Creator Account &rarr;
        </button>
      </form>
    </div>
  </main>

  <div id="toastContainer" class="toast-container"></div>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
