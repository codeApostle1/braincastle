<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create New Password — BrainCastle</title><link rel="stylesheet" href="/css/base.css"><link rel="stylesheet" href="/css/components.css"></head>
<body><header class="navbar"><div class="container nav-container"><a href="/" class="nav-brand"><div class="brand-icon">🏰</div><span>Brain<span style="color:var(--color-primary)">Castle</span></span></a></div></header>
<main class="container"><section style="max-width:440px;margin:var(--space-8) auto;padding:var(--space-6);background:var(--color-bg-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);box-shadow:var(--shadow-md)"><h1 style="margin-bottom:var(--space-2)">Create a new password</h1><p style="color:var(--color-text-secondary);margin-bottom:var(--space-5)">Choose a new password with at least 10 characters.</p><form id="resetForm"><label class="form-label" for="password">New password</label><input class="search-input" style="width:100%;margin-bottom:var(--space-4)" id="password" type="password" minlength="10" maxlength="128" required autocomplete="new-password"><label class="form-label" for="confirm">Confirm new password</label><input class="search-input" style="width:100%;margin-bottom:var(--space-4)" id="confirm" type="password" minlength="10" maxlength="128" required autocomplete="new-password"><button class="btn btn-primary btn-block" id="resetBtn">Update password</button></form><p id="message" role="status" style="margin-top:var(--space-4);font-size:var(--font-size-sm)"></p></section></main><script src="/js/api.js"></script><script src="/js/reset-password.js"></script></body></html>
